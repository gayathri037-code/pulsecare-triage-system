services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pulsecare
      POSTGRES_USER: pulsecare
      POSTGRES_PASSWORD: pulsecare
    ports: ["5432:5432"]
    volumes: ["pulsecare-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsecare -d pulsecare"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://pulsecare:pulsecare@db:5432/pulsecare
      JWT_SECRET: local-development-secret-change-me
      FRONTEND_ORIGIN: http://localhost:3000
    ports: ["8000:8000"]
    command: sh -c "python seed.py && uvicorn main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  pulsecare-db:
